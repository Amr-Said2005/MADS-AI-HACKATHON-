# One command: docker compose up   ->  open http://localhost:8000
# The model runs on OpenRouter, so set LLM_API_KEY (your OpenRouter key) in .env or the shell.
# Requirement R-ONE-COMMAND: every variable in this file has a default and no service asks for a
# GPU, so `docker compose up` starts the app; the page says when the model endpoint is not reachable.
# Verified by: tests/test_structure.py::test_compose_defaults_need_no_env_and_no_gpu
services:
  # Requirement R-OPEN-MODEL: the app calls an open-weight model (gpt-oss-20b) on OpenRouter's OpenAI-compatible
  # endpoint by default; the key comes from LLM_API_KEY, and no model runs in this compose file.
  # Verified by: tests/test_traceability.py::test_compose_defaults_to_the_openrouter_model
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      LLM_BACKEND: ${LLM_BACKEND:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_API_KEY: ${LLM_API_KEY:-placeholder}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-20b}
      LLM_MODE: ${LLM_MODE:-live}
      FAST_MODE: ${FAST_MODE:-false}
      MAX_SOURCES: ${MAX_SOURCES:-6}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      CONTACT_URL: ${CONTACT_URL:-}
      DDGS_ENABLED: ${DDGS_ENABLED:-true}
      N_ARCHITECTS: ${N_ARCHITECTS:-1}
      MAX_MODEL_CALLS: ${MAX_MODEL_CALLS:-60}
      MAX_RUN_SECONDS: ${MAX_RUN_SECONDS:-900}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-8192}
      LLM_THINK: ${LLM_THINK:-auto}
      LLM_PRICE_IN_PER_MTOK: ${LLM_PRICE_IN_PER_MTOK:-0.018}
      LLM_PRICE_OUT_PER_MTOK: ${LLM_PRICE_OUT_PER_MTOK:-0.09}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-300}
    volumes:  # :z relabels the folders so the container can write to them under SELinux (Fedora)
      - ./runs:/app/runs:z
      - ./outputs:/app/outputs:z
      - ./decision_log.json:/app/decision_log.json:z
    depends_on:
      searxng:
        condition: service_started

  # Local metasearch for the researcher (JSON output on). Not published on a host port.
  searxng:
    image: searxng/searxng:2026.10.30-ffa88e3ba
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-local-only-placeholder-change-me}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

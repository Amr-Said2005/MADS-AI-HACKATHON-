<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Venture Builder{% endblock %}</title>
<style>
  :root { --bg:#fbfaf7; --fg:#1d1d1b; --muted:#6b6b66; --line:#e2e0d8; --card:#ffffff;
          --ok:#1f7a3f; --warn:#9a5b00; --bad:#a3272a; --mock:#fff1c2; --mockline:#d9a400; --stub:#eceaf6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161614; --fg:#ecebe6; --muted:#a3a29b; --line:#33322e; --card:#1f1f1c;
            --ok:#6cc58a; --warn:#e0a548; --bad:#ec7a7c; --mock:#3a3010; --mockline:#b38900; --stub:#2a2838; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.5rem; margin: .5rem 0 1rem; } h2 { font-size: 1.1rem; margin: 1.5rem 0 .5rem; }
  a { color: inherit; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin:10px 0; }
  .banner { background:var(--mock); border:2px solid var(--mockline); border-radius:8px; padding:10px 14px; margin:10px 0; font-weight:600; }
  table { border-collapse: collapse; width:100%; } th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align: top; }
  .tablewrap { overflow-x:auto; }
  .tag { display:inline-block; padding:1px 7px; border-radius:4px; font-size:.8rem; font-weight:700; letter-spacing:.02em; }
  .MOCKED { background:var(--mock); border:1px solid var(--mockline); } .STUBBED { background:var(--stub); border:1px solid var(--line); }
  .Implemented, .done, .go, .ok { color:var(--ok); } .stopped, .stop, .bad { color:var(--bad); } .blocked, .awaiting_approval, .warn { color:var(--warn); }
  .muted { color:var(--muted); } code, pre { font-family: ui-monospace, Consolas, monospace; font-size:.85rem; }
  pre { white-space: pre-wrap; word-break: break-word; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; }
  button, select, input[type=text] { font: inherit; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  button { cursor:pointer; } button.primary { background:var(--fg); color:var(--bg); }
  form.inline { display:inline-flex; gap:6px; flex-wrap:wrap; align-items:center; margin:4px 0; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<main>
  <p class="muted"><a href="/">Venture Builder</a></p>
  {% if llm_mocked %}<div class="banner">MOCKED: LLM_MODE=mock. Model output is canned text; nothing from this mode is ever committed.</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>

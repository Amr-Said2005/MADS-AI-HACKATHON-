# SearXNG for the researcher agent: JSON output on, rate limiter off (the instance is only
# reachable inside the compose network). The secret key comes from SEARXNG_SECRET.
use_default_settings: true

server:
  limiter: false
  image_proxy: false

search:
  safe_search: 1
  formats:
    - html
    - json

# Yahoo is off in the default settings. It is turned on so that a search still returns results when
# the default engines answer with a CAPTCHA or "too many requests" after many runs from one address.
engines:
  - name: yahoo
    disabled: false

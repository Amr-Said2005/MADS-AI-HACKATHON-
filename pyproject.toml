[project]
name = "venture-builders"
version = "0.1.0"
description = "Open-source team of AI agents that takes a founder's idea toward a validated, sellable digital product, with founder approval gates."
requires-python = ">=3.12"
license = "MIT"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

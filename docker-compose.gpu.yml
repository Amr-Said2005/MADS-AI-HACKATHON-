# Optional NVIDIA GPU for Ollama. Needs the NVIDIA Container Toolkit (or Docker Desktop with WSL 2 GPU support).
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
# On a large GPU you can also choose a bigger model, e.g. LLM_MODEL=gpt-oss:20b.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
